<!-- src/ui/index.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="statistics">📊 统计</button>
    <button class="tab-btn" data-tab="mapping">📋 映射</button>
    <button class="tab-btn" data-tab="settings">⚙️ 设置</button>
  </div>

  <!-- Tab 1: Statistics — unified workbench -->
  <div id="tab-statistics" class="tab-content active">

    <!-- Scan controls (always visible) -->
    <div id="scan-controls" class="toolbar">
      <button onclick="scanAll()">扫描全部</button>
      <button onclick="scanSelected()">仅选中面</button>
      <button onclick="manualMark()">手动标记面</button>
    </div>

    <!-- Empty state (before first scan) -->
    <div id="empty-state" class="empty-state">
      <p>🔍 请先点击「扫描全部」或「仅选中面」</p>
    </div>

    <!-- Workbench (shown after scan) -->
    <div id="workbench" style="display:none">

      <!-- Summary bar -->
      <div id="summary-bar" class="summary-bar"></div>

      <!-- View switcher -->
      <div class="view-bar">
        <button class="view-btn active" data-view="component" onclick="switchWorkbenchView('component')">按组件</button>
        <button class="view-btn" data-view="material" onclick="switchWorkbenchView('material')">按材料</button>
        <button class="view-btn" data-view="purchase" onclick="switchWorkbenchView('purchase')">采购量</button>
        <button class="view-btn" data-view="zone" onclick="switchWorkbenchView('zone')">按区域</button>
      </div>

      <!-- View containers (only one visible at a time) -->
      <div id="view-component" class="view-container"></div>
      <div id="view-material" class="view-container" style="display:none"></div>
      <div id="view-purchase" class="view-container" style="display:none"></div>
      <div id="view-zone" class="view-container" style="display:none"></div>
    </div>
  </div>

  <!-- Tab 2: Mapping management -->
  <div id="tab-mapping" class="tab-content">
    <div id="mapping-content"></div>
  </div>

  <!-- Tab 3: Settings -->
  <div id="tab-settings" class="tab-content">
    <h3>模型属性字典</h3>
    <p class="hint">将映射规则、工艺做法、忽略列表保存到当前 SU 模型中。打开模型时自动加载，实现「规则随模型走」。</p>
    <div class="toolbar">
      <button onclick="snapshotToModel()" class="primary-btn">保存规则到模型</button>
      <button onclick="loadFromModel()">从模型加载规则</button>
    </div>
  </div>

  <!-- Marking Dialog (hidden) -->
  <div id="marking-dialog" class="modal" style="display:none">
    <div class="modal-content">
      <h3>手动标记面</h3>
      <label>材料名称: <input type="text" id="mark-material"></label>
      <label>部位:
        <select id="mark-part">
          <option value="floor">地面</option>
          <option value="wall">墙面</option>
          <option value="ceiling">天花</option>
        </select>
      </label>
      <label>所属空间: <input type="text" id="mark-space"></label>
      <label>损耗率: <input type="number" id="mark-waste" step="0.01" value="0.05"></label>
      <div class="modal-actions">
        <button onclick="confirmMark()">确认标记</button>
        <button onclick="closeMarkDialog()">取消</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
