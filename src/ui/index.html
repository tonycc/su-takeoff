<!-- src/ui/index.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="styles.css?v=login-gate-20260727">
</head>
<body class="login-page-active">
<div class="app-layout">

  <!-- 左侧菜单栏 -->
  <nav class="sidebar">
    <div class="sidebar-brand">SU 材料统计</div>

    <div class="sidebar-group">
      <div class="sidebar-label">扫描</div>
      <button class="sb-btn primary" onclick="scanAll()">扫描全部</button>
      <button class="sb-btn" onclick="scanSelected()">仅选中面</button>
    </div>

    <div class="sidebar-group">
      <div class="sidebar-label">统计</div>
      <button class="sb-nav" data-page="position" disabled>按组件</button>
    </div>

    <div class="sidebar-group">
      <div class="sidebar-label">管理</div>
      <button class="sb-nav" data-page="mapping" disabled>材料映射</button>
      <button class="sb-nav" data-page="comp-mapping" disabled>群组/组件映射</button>
      <button class="sb-nav" data-page="settings" disabled>设置</button>
      <button class="sb-nav" data-page="cloud" disabled>云端同步</button>
    </div>
  </nav>

  <!-- 右侧主内容 -->
  <main class="main">

    <div id="loading-overlay">
      <div class="loading-spinner"></div>
      <div class="loading-text">正在扫描…</div>
    </div>

    <div id="page-login" class="page-content">
      <div id="login-content">
        <div class="login-shell">
          <section class="panel login-panel">
            <h2>登录 SU Takeoff</h2>
            <p class="cloud-hint">请先登录平台账号，登录成功后才能使用扫描、映射、设置和云端同步功能。</p>
            <p class="cloud-hint">正在校验登录状态...</p>
            <label>账号</label><input id="login-username" type="text">
            <label>密码</label><input id="login-password" type="password">
            <button class="primary-btn" onclick="window.cloudLoginFromLoginPage && window.cloudLoginFromLoginPage()">登录</button>
          </section>
        </div>
      </div>
    </div>
    <div id="page-position" class="page-content" style="display:none">
      <div class="empty-state"><p>请先点击「扫描全部」或「仅选中面」</p></div>
    </div>
    <div id="page-mapping" class="page-content" style="display:none">
      <div id="mapping-content"></div>
    </div>
    <div id="page-comp-mapping" class="page-content" style="display:none">
      <div id="comp-mapping-content"></div>
    </div>
    <div id="page-settings" class="page-content" style="display:none">
      <div id="settings-content"></div>
    </div>
    <div id="page-cloud" class="page-content" style="display:none">
      <div id="cloud-content"></div>
    </div>
  </main>

</div>

<!-- ========== Templates ========== -->
<template id="tmpl-mapping-row">
  <tr>
    <td class="col-seq" style="text-align:right;color:#6c7086;font-size:11px"></td>
    <td class="col-su-name"></td>
    <td><input type="text" class="u-mat"></td>
    <td><input type="text" class="u-platform-tag"></td>
    <td class="col-sku">
      <input type="text" class="u-sku" placeholder="搜索SKU" autocomplete="off">
      <div class="sku-dropdown" style="display:none"></div>
    </td>
    <td><select class="u-cat" onchange="onMappingCatChange(this)"></select></td>
    <td><input type="text" class="u-unit" list="mapping-unit-list" style="width:60px"></td>
    <td class="col-actions"></td>
  </tr>
</template>

<template id="tmpl-mapping-unmapped-row">
  <tr class="unmapped-row">
    <td class="col-seq" style="text-align:right;color:#6c7086;font-size:11px"></td>
    <td>
      <div class="u-name-row">
        <span class="swatch"></span>
        <span class="u-name"></span>
      </div>
    </td>
    <td class="col-quantity"></td>
    <td class="col-parts"></td>
    <td><input type="text" class="u-mat" placeholder="输入材料名"></td>
    <td><input type="text" class="u-platform-tag" placeholder="平台标签"></td>
    <td class="col-sku">
      <input type="text" class="u-sku" placeholder="搜索SKU" autocomplete="off">
      <div class="sku-dropdown" style="display:none"></div>
    </td>
    <td><select class="u-cat" onchange="onMappingCatChange(this)"></select></td>
    <td><input type="text" class="u-unit" list="mapping-unit-list" style="width:60px"></td>
    <td class="col-actions"></td>
  </tr>
</template>

<script src="app.js?v=login-gate-20260727"></script>
<script src="js/model_view.js"></script>
<script src="js/mapping.js"></script>
<script src="js/comp_mapping.js"></script>
<script src="js/settings.js"></script>
<script src="js/cloud_sync.js?v=login-gate-20260727"></script>
</body>
</html>
