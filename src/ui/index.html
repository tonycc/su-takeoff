<!-- src/ui/index.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="statistics">📊 统计</button>
    <button class="tab-btn" data-tab="mapping">📋 映射</button>
    <button class="tab-btn" data-tab="settings">⚙️ 设置</button>
  </div>

  <!-- Tab 1: Statistics — three-phase card switching -->
  <div id="tab-statistics" class="tab-content active">

    <!-- Phase 1: Scan -->
    <div id="phase-scan" class="phase-card">
      <div id="scan-controls" class="toolbar">
        <button onclick="scanAll()">扫描全部</button>
        <button onclick="scanSelected()">仅选中面</button>
        <button onclick="manualMark()">手动标记面</button>
      </div>
      <div id="scan-results" style="display:none">
        <div id="scan-overview" class="scan-overview"></div>
        <h4 class="section-title">容器汇总</h4>
        <div id="container-table-container" class="scroll-table">
          <table id="container-table">
            <thead>
              <tr>
                <th>容器名称</th>
                <th>路径</th>
                <th>面数</th>
                <th>总面积(m²)</th>
                <th>地面(m²)</th>
                <th>墙面(m²)</th>
                <th>天花(m²)</th>
                <th>材质数</th>
                <th>材质列表</th>
              </tr>
            </thead>
            <tbody id="container-body"></tbody>
          </table>
        </div>
        <h4 class="section-title">展开明细（点击展开查看面详情）</h4>
        <div id="scan-tree-container"></div>
        <h4 class="section-title">洞口列表</h4>
        <div id="opening-table-container" class="scroll-table">
          <table id="opening-table">
            <thead>
              <tr>
                <th>实体ID</th>
                <th>面积(m²)</th>
                <th>关联母面ID</th>
              </tr>
            </thead>
            <tbody id="opening-body"></tbody>
          </table>
        </div>
        <div class="toolbar" style="justify-content:center; margin-top:12px">
          <button onclick="goToMapping()" class="primary-btn">下一步 → 处理映射</button>
        </div>
      </div>
    </div>

    <!-- Phase 2: Mapping -->
    <div id="phase-mapping" class="phase-card" style="display:none">
      <div class="toolbar">
        <button onclick="goToScan()">← 返回扫描结果</button>
        <span class="hint" id="mapping-summary">待处理材质</span>
        <button onclick="fillCommonDefaults()">一键填默认</button>
        <button onclick="saveUnmappedBatch()">保存映射</button>
        <button onclick="ignoreAllUnresolved()">全部忽略</button>
      </div>
      <table id="review-table">
        <thead>
          <tr>
            <th style="width:4%">状态</th>
            <th style="width:22%">SU材质（色/面数/面积）</th>
            <th style="width:18%">部位/空间</th>
            <th>真实材料名</th>
            <th>分类</th>
            <th>规格</th>
            <th>损耗率</th>
            <th>忽略</th>
            <th>定位</th>
          </tr>
        </thead>
        <tbody id="review-body"></tbody>
      </table>
      <div id="mapping-proceed" style="display:none">
        <div class="toolbar" style="justify-content:center; margin-top:12px">
          <button onclick="finalizeCompute()" class="primary-btn">确认并统计 →</button>
        </div>
      </div>
    </div>

    <!-- Phase 3: Statistics -->
    <div id="phase-stats" class="phase-card" style="display:none">
      <div class="toolbar">
        <button onclick="goToMapping()">← 返回映射</button>
      </div>
      <div class="view-bar">
        <button class="view-btn active" data-view="by-component" onclick="switchView('by-component')">按组件</button>
        <button class="view-btn" data-view="by-space" onclick="switchView('by-space')">按空间汇总</button>
        <button class="view-btn" data-view="by-material" onclick="switchView('by-material')">按材料汇总</button>
        <button class="view-btn" data-view="detail" onclick="switchView('detail')">展开明细</button>
      </div>
      <div id="stats-table-container"></div>
    </div>

  </div>

  <!-- Tab 2: Mapping management -->
  <div id="tab-mapping" class="tab-content">
    <div class="toolbar">
      <input type="text" id="search-mapping" placeholder="搜索SU材质..." oninput="filterMappings()">
      <button onclick="importCsv()">导入CSV</button>
      <button onclick="exportCsv()">导出CSV</button>
      <button onclick="openAddMapping()">+ 新增</button>
    </div>
    <div id="mapping-table-container">
      <table id="mapping-table">
        <thead>
          <tr>
            <th>SU材质名</th>
            <th>真实材料名</th>
            <th>分类</th>
            <th>单位</th>
            <th>规格</th>
            <th>默认损耗率</th>
            <th>工艺</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="mapping-body"></tbody>
      </table>
    </div>
  </div>

  <!-- Tab 3: Settings -->
  <div id="tab-settings" class="tab-content">
    <h3>模型属性字典</h3>
    <p class="hint">将映射规则、工艺做法、忽略列表保存到当前 SU 模型中。打开模型时自动加载，实现「规则随模型走」。</p>
    <div class="toolbar">
      <button onclick="snapshotToModel()" class="primary-btn">保存规则到模型</button>
      <button onclick="loadFromModel()">从模型加载规则</button>
    </div>
  </div>

  <!-- Marking Dialog (hidden) -->
  <div id="marking-dialog" class="modal" style="display:none">
    <div class="modal-content">
      <h3>手动标记面</h3>
      <label>材料名称: <input type="text" id="mark-material"></label>
      <label>部位:
        <select id="mark-part">
          <option value="floor">地面</option>
          <option value="wall">墙面</option>
          <option value="ceiling">天花</option>
        </select>
      </label>
      <label>所属空间: <input type="text" id="mark-space"></label>
      <label>损耗率: <input type="number" id="mark-waste" step="0.01" value="0.05"></label>
      <div class="modal-actions">
        <button onclick="confirmMark()">确认标记</button>
        <button onclick="closeMarkDialog()">取消</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
